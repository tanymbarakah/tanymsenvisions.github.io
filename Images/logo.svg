<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" role="img" aria-label="Tanym's Envisions Logo">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="tePrimaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0099ff" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>

    <linearGradient id="teCyanBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00ffa3" />
    </linearGradient>

    <linearGradient id="teDarkBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#080a10" />
    </linearGradient>

    <!-- Subtle Cyber Glow Filter -->
    <filter id="teGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cyber Squircle Shield -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#teDarkBase)" stroke="url(#tePrimaryGlow)" stroke-width="3" />
  
  <!-- Ambient Inner Frame Ring -->
  <rect x="12" y="12" width="76" height="76" rx="18" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- The "T" & "E" Quantum Vision Monogram -->
  <!-- Top Bar of "T" with Tech Cuts -->
  <path d="M26 28 H74 M50 28 V72" stroke="url(#tePrimaryGlow)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#teGlowFilter)" />

  <!-- "E" Prismatic Envision Beams (Radiating Rightward from the Central Pillar) -->
  <path d="M50 42 H70" stroke="url(#teCyanBeam)" stroke-width="5" stroke-linecap="round" />
  <path d="M50 56 H66" stroke="url(#teCyanBeam)" stroke-width="5" stroke-linecap="round" />
  <path d="M50 72 H72" stroke="url(#tePrimaryGlow)" stroke-width="5.5" stroke-linecap="round" />

  <!-- The Envision Focal Spark (Optic Core) -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" filter="url(#teGlowFilter)" />
  <circle cx="50" cy="50" r="2" fill="#00f0ff" />

  <!-- Precision Corner Tech Accents -->
  <circle cx="22" cy="74" r="2" fill="#00f0ff" opacity="0.6" />
  <circle cx="78" cy="24" r="2" fill="#8a2be2" opacity="0.8" />
  <path d="M22 22 L27 22 M22 22 L22 27" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <path d="M78 78 L73 78 M78 78 L78 73" stroke="#8a2be2" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
</svg>
